server:
  port: ${SERVER_PORT:8099}

spring:
  application:
    name: ms-exemplo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exemplo_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
